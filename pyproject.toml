[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkpulse"
version = "1.0.0"
description = "LinkPulse — ML-powered phishing URL detection (API, dashboard, Chrome extension)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "scikit-learn>=1.4,<2.0",
    "pandas>=2.2,<4.0",
    "numpy>=1.26,<3.0",
    "joblib>=1.3,<2.0",
    "tldextract>=5.1,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
linkpulse-train = "backend.ml.train:main"

[tool.setuptools]
packages = ["backend", "backend.ml", "backend.api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: full-stack tests crossing ML -> API boundaries",
    "e2e: end-to-end tests that need a running server or built frontend",
    "slow: trains a model from scratch",
]
filterwarnings = [
    "ignore::DeprecationWarning:sklearn.*",
]
